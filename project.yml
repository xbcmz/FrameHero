name: LiveCapture
options:
  bundleIdPrefix: com.livecompose
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: zh-Hans
  createIntermediateGroups: true
  generateEmptyDirectories: true
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    SDKROOT: iphoneos
    SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
    ENABLE_PREVIEWS: YES
    SWIFT_STRICT_CONCURRENCY: minimal
    GENERATE_INFOPLIST_FILE: NO
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    CODE_SIGNING_REQUIRED: YES
    CODE_SIGNING_ALLOWED: YES
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  LiveCapture:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: LiveCapture
        excludes:
          - "Info.plist"
          - "Core/Models/student"     # 排除原始 mlpackage（已手动预编译）
          - "Core/Models/teacher"
    resources:
      - path: LiveCapture/startup_bg.jpeg
      - path: LiveCapture/Core/Models/Compiled/AdacropStudentBBox.mlmodelc
      - path: LiveCapture/Core/Models/Compiled/AdacropStudentActor.mlmodelc
      - path: LiveCapture/Core/Models/Compiled/AdacropTeacherBBox.mlmodelc
      - path: LiveCapture/Core/Models/Compiled/AdacropTeacherActor.mlmodelc
    info:
      path: LiveCapture/Info.plist
      properties:
        CFBundleDisplayName: LiveCapture
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiredDeviceCapabilities:
          - armv7
        NSCameraUsageDescription: "LiveCapture 需要使用相机来实时分析构图并提供拍摄建议。"
        NSPhotoLibraryAddUsageDescription: "LiveCapture 需要保存分享卡片到您的相册。"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.livecompose.livecapture
        PRODUCT_NAME: LiveCapture
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_FILE: LiveCapture/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGNING_REQUIRED: YES
        CODE_SIGNING_ALLOWED: YES
        DEVELOPMENT_TEAM: ""
        ENABLE_USER_SCRIPT_SANDBOXING: NO
